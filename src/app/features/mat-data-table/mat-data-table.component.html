<div class="mat-datatable-container">
  <div class="table-header">
    <h2>Crew Manifest</h2>
    <input
      type="text"
      class="filter-input"
      placeholder="Search crew..."
      (input)="applyFilter($event)">
  </div>

  <div class="table-wrapper">
    <table mat-table [dataSource]="dataSource" matSort class="themed-mat-table">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
        <td mat-cell *matCellDef="let row"> {{ row.id }} </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
        <td mat-cell *matCellDef="let row"> {{ row.name }} </td>
      </ng-container>

      <ng-container matColumnDef="rank">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Rank </th>
        <td mat-cell *matCellDef="let row"> {{ row.rank }} </td>
      </ng-container>

      <ng-container matColumnDef="department">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Department </th>
        <td mat-cell *matCellDef="let row"> {{ row.department }} </td>
      </ng-container>

      <ng-container matColumnDef="clearance">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Clearance </th>
        <td mat-cell *matCellDef="let row">
          <span class="clearance-bar">
            <span class="clearance-fill" [style.width.%]="row.clearance * 10"></span>
            <span class="clearance-label">{{ row.clearance }}</span>
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
        <td mat-cell *matCellDef="let row">
          <span class="status-badge" [ngClass]="getStatusClass(row.status)">
            {{ row.status }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="enlistDate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Enlisted </th>
        <td mat-cell *matCellDef="let row"> {{ row.enlistDate }} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row no-data-row" *matNoDataRow>
        <td class="mat-cell empty-message" [attr.colspan]="displayedColumns.length">
          No crew members match "{{ filterValue }}"
        </td>
      </tr>

    </table>
  </div>

  <mat-paginator
    [pageSizeOptions]="[5, 10, 20]"
    [pageSize]="10"
    showFirstLastButtons>
  </mat-paginator>
</div>
