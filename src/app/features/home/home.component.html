<div class="home-container">
  <!-- Header -->
  <div class="header">
    <h1>Popout - A Basic Framework</h1>
    <p class="subtitle">Explore data across multiple domains</p>
  </div>

  <!-- Parabola Chart -->
  <div class="chart-section">
    <div class="chart-card" *ngIf="!chartPoppedOut">
      <div class="chart-header">
        <h2>Parabola</h2>
        <button class="popout-btn" (click)="openChartPopOut()" title="Pop out chart">
          <span>&#8599;</span>
        </button>
      </div>
      <app-parabola-chart></app-parabola-chart>
    </div>
    <div class="chart-placeholder" *ngIf="chartPoppedOut">
      <span>Parabola (popped out)</span>
    </div>
    <div class="range-inputs">
      <label>
        Min
        <input type="number" [(ngModel)]="plotMin" (ngModelChange)="onPlotRangeChange()" step="0.5">
      </label>
      <label>
        Max
        <input type="number" [(ngModel)]="plotMax" (ngModelChange)="onPlotRangeChange()" step="0.5">
      </label>
    </div>
  </div>

  <!-- Domains -->
  <div class="domains-section">
    <div class="domain-grid">
      <div class="domain-card-container" *ngFor="let tile of tiles">
        <!-- Placeholder when popped out -->
        <div class="placeholder" *ngIf="isPoppedOut(tile.id)">
          <span>{{ tile.title }}</span>
        </div>

        <!-- Active card -->
        <a class="domain-card" *ngIf="!isPoppedOut(tile.id)" (click)="openPopOut(tile)">
          <div class="card-icon">{{ tile.icon }}</div>
          <h3>{{ tile.title }}</h3>
          <p>{{ tile.description }}</p>
        </a>

        <input
          type="text"
          class="domain-input"
          [ngModel]="tileInputs[tile.id]"
          (ngModelChange)="onInputChange(tile.id, $event)"
          placeholder="Enter query...">
      </div>
    </div>
  </div>

</div>
